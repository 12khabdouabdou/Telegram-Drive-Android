name: "Build All Platforms"

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish-tauri:
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows (Standard x64)
          - platform: windows-latest
            args: ''
            
          # Linux (Ubuntu x64)
          - platform: ubuntu-22.04
            args: ''
            
          # macOS (Apple Silicon / ARM64)
          - platform: macos-latest
            args: ''

          # Android (on Ubuntu)
          - platform: ubuntu-22.04
            args: --target aarch64-linux-android
            is_android: true

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Targets: Linux, Windows, Mac ARM, and Android
          targets: aarch64-apple-darwin, x86_64-unknown-linux-gnu, x86_64-pc-windows-msvc, aarch64-linux-android

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            unzip \
            xz-utils \
            zip \
            openjdk-17-jdk

      - name: Setup Java JDK (for Android)
        if: matrix.is_android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK (for Android)
        if: matrix.is_android
        uses: android-actions/setup-android@v2

      - name: Configure Android SDK
        if: matrix.is_android
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" --sdk_root=$ANDROID_HOME || true

      - name: Set up Android NDK environment
        if: matrix.is_android
        run: |
          NDK_VERSION="26.1.10909125"
          TOOLCHAIN="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> $GITHUB_ENV
          echo "$TOOLCHAIN/bin" >> $GITHUB_PATH
          echo "CC_aarch64-linux-android=$TOOLCHAIN/bin/aarch64-linux-android21-clang" >> $GITHUB_ENV
          echo "AR_aarch64-linux-android=$TOOLCHAIN/bin/llvm-ar" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/bin/aarch64-linux-android21-clang" >> $GITHUB_ENV

      - name: Initialize Android project
        if: matrix.is_android
        working-directory: app
        run: npx tauri android init

      - name: install frontend dependencies
        working-directory: app
        run: npm install

      - name: build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__ 
          releaseName: 'App v__VERSION__'
          releaseBody: |
            ## Download Instructions
            
            **Desktop Apps:**
            - Windows: Download the `.msi` or `.exe` file
            - macOS: Download the `.dmg` file
            - Linux: Download the `.AppImage` or `.deb` file
            
            **Android APK:**
            - Download the unsigned `.apk` file
            - Enable "Install from Unknown Sources" in Android settings
            - Sideload the APK on your device
            
          releaseDraft: true
          prerelease: false
          projectPath: ./app
          args: ${{ matrix.args }}

      - name: Upload Android APK as artifact
        if: matrix.is_android
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            app/src-tauri/target/aarch64-linux-android/release/bundle/apk/*.apk
            app/src-tauri/target/*/release/bundle/apk/*.apk
          retention-days: 7