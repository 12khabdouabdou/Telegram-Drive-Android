name: Build Android APK

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build-android:
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Android on Ubuntu
          - platform: ubuntu-22.04
            android-target: android

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm install

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          toolchain: stable

      - name: Install Android dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            unzip \
            xz-utils \
            zip \
            openjdk-17-jdk

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Configure Android SDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" --sdk_root=$ANDROID_HOME || true

      - name: Set up Android NDK environment
        run: |
          NDK_VERSION="26.1.10909125"
          TOOLCHAIN="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> $GITHUB_ENV
          echo "$TOOLCHAIN/bin" >> $GITHUB_PATH
          echo "CC_aarch64-linux-android=$TOOLCHAIN/bin/aarch64-linux-android21-clang" >> $GITHUB_ENV
          echo "AR_aarch64-linux-android=$TOOLCHAIN/bin/llvm-ar" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/bin/aarch64-linux-android21-clang" >> $GITHUB_ENV

      - name: Initialize Android project
        working-directory: app
        run: npx tauri android init

      - name: Verify Android permissions
        run: |
          MANIFEST=app/src-tauri/gen/android/app/src/main/AndroidManifest.xml
          if [ -f "$MANIFEST" ]; then
            echo "Checking permissions in: $MANIFEST"
            if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
              sed -i '/<\/manifest>/i <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
            fi
            if ! grep -q "android.permission.WRITE_EXTERNAL_STORAGE" "$MANIFEST"; then
              sed -i '/<\/manifest>/i <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />' "$MANIFEST"
            fi
            if ! grep -q "android.permission.READ_EXTERNAL_STORAGE" "$MANIFEST"; then
              sed -i '/<\/manifest>/i <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />' "$MANIFEST"
            fi
            # Safely add cleartext traffic for local video/image streaming without creating duplicate attributes
            sed -i 's/android:usesCleartextTraffic="[^"]*"//g' "$MANIFEST"
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' "$MANIFEST"
          else
            echo "Manifest not found at $MANIFEST (may be generated later during build)"
          fi

      - name: Build Android APK
        working-directory: app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tauri android build --apk --ci

      - name: Sign APK with debug key
        run: |
          # Generate debug keystore
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          # Find the unsigned APK
          APK=$(find app/src-tauri/gen/android -name "*-unsigned.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "No unsigned APK found, looking for any APK..."
            APK=$(find app/src-tauri/gen/android -name "*.apk" | head -1)
          fi

          if [ -n "$APK" ]; then
            echo "Signing APK: $APK"
            BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
            "$BUILD_TOOLS/apksigner" sign --ks debug.keystore --ks-pass pass:android \
              --ks-key-alias androiddebugkey "$APK"
            "$BUILD_TOOLS/apksigner" verify "$APK"
            # Rename to remove -unsigned suffix
            SIGNED="${APK/-unsigned/}"
            if [ "$APK" != "$SIGNED" ]; then
              mv "$APK" "$SIGNED"
              echo "APK renamed to: $SIGNED"
            fi
            echo "APK signed successfully: $SIGNED"
          else
            echo "No APK found to sign"
            exit 1
          fi

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            app/src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
            app/src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk
          retention-days: 7

      - name: Upload debug symbols
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols
          path: |
            app/src-tauri/target/*/deps/*.d
            app/src-tauri/target/*/*.so
          retention-days: 7
          compression-level: 9