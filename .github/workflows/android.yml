name: Build Android APK

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build-android:
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Android on Ubuntu
          - platform: ubuntu-22.04
            android-target: android

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm install

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          toolchain: stable

      - name: Install Android dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            unzip \
            xz-utils \
            zip \
            openjdk-17-jdk \
            android-sdk \
            android-sdk-build-tools \
            android-sdk-platform-tools

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Configure Android SDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" --sdk_root=$ANDROID_HOME || true

      - name: Build Android APK
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: android-v__VERSION__
          releaseName: 'Android v__VERSION__'
          releaseBody: 'Android APK build. Sideload this unsigned APK on your device.'
          releaseDraft: false
          prerelease: true
          projectPath: ./app
          args: --target aarch64-linux-android --bundles android

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/src-tauri/target/*/android-build/*.apk
          retention-days: 7

      - name: Upload debug symbols
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols
          path: |
            app/src-tauri/target/*/deps/*.d
            app/src-tauri/target/*/*.so
          retention-days: 7
          compression-level: 9